name: Build & Test (Python)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 0 * * *" 

jobs:
  build:
     runs-on: ubuntu-latest

     steps:
       - name: Checkout
         uses: actions/checkout@4

       - name: Setup Python
         uses: actions/setup-python@v5
         with:
           python-version: "3.12"

       - name: Install dependencies (pip, pytest, ruff)
         run: |
           python -m pip install --upgradepip
           if [ -f requirements.txt]; then pip install -r requirements.txt; fi pip install pytest ruff

       - name: Lint with Ruff (PR annotations)
         run: ruff check --output-format=github.

       - name: Run tests (pytest)
         run: |
           if [ -d tests ] || [ -f pytest.ini ] || [ -f pyproject.toml ]; then
            pytest -q
           else
            eche "No tests found; skipping."
            fi
        
